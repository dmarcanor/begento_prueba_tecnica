services:
  php:
    build: 
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        DEV_UID: ${HOST_UID}
        DEV_GID: ${HOST_GID}
    # container_name: php
    working_dir: /var/www/html
    restart: always
    volumes:
      - .:/var/www/html
    ports:
      - 9000:9000
    networks:
      - prueba_tecnica
    environment:
      TZ: America/Caracas
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
  
  nginx:
    image: nginx:alpine
    # container_name: nginx
    working_dir: /var/www/html
    restart: always
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8000:80
    networks:
      - prueba_tecnica
    depends_on:
      - php
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M

  postgres:
    image: postgres:18.3-alpine
    # container_name: postgres
    restart: unless-stopped
    ports:
      - 5432:5432
    networks:
      - prueba_tecnica
    environment:
      POSTGRES_USER: ${DB_USERNAME:-pguser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_DATABASE:-app_db}
      TZ: America/Caracas
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=es_VE.utf8 --data-checksums"
    volumes:
      - prueba_tecnica_postgres_data:/var/lib/postgresql:rw
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
  
  redis:
    image: redis:8.6.2-alpine
    # container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - prueba_tecnica_redis_data:/data
    ports:
      - 6379:6379
    networks:
      - prueba_tecnica
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

volumes:
  prueba_tecnica_postgres_data:
    external: true
  prueba_tecnica_redis_data:
    external: true

networks:
  prueba_tecnica: