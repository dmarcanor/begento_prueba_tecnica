services:
  php:
    build: 
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        DEV_UID: ${HOST_UID:-1000}
        DEV_GID: ${HOST_GID:-1000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /var/www/html
    restart: always
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - prueba_tecnica
    environment:
      TZ: America/Caracas
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
  
  nginx:
    image: nginx:alpine
    working_dir: /var/www/html
    restart: always
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8000:80"
    networks:
      - prueba_tecnica
    depends_on:
      - php
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M

  postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - prueba_tecnica
    environment:
      POSTGRES_USER: ${DB_USERNAME:-prueba_tecnica_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-prueba_tecnica}
      TZ: America/Caracas
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --data-checksums"
    volumes:
      - prueba_tecnica_postgres_data:/var/lib/postgresql:rw
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-prueba_tecnica_user} -d ${DB_DATABASE:-prueba_tecnica} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  prueba_tecnica_postgres_data:
    external: true

networks:
  prueba_tecnica: