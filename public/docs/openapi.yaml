openapi: 3.0.3
info:
  title: Prueba Técnica API
  description: API REST para gestión de productos con precios multi-moneda
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8000/api
    description: Servidor de desarrollo

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token

  schemas:
    Error:
      type: object
      properties:
        error:
          oneOf:
            - type: array
              items:
                type: string
            - type: object
              additionalProperties:
                type: array
                items:
                  type: string
        body:
          type: object

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          example: password

    LoginResponse:
      type: object
      properties:
        error:
          type: array
          items: {}
        body:
          type: object
          properties:
            access_token:
              type: string
            token_type:
              type: string
              example: bearer
            expires_at:
              type: string
              format: date-time

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Producto de ejemplo
        description:
          type: string
          example: Descripción detallada del producto
        price:
          type: string
          example: "100.00"
        currency_id:
          type: integer
          example: 1
        tax_cost:
          type: string
          example: "16.00"
        manufacturing_cost:
          type: string
          example: "50.00"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    ProductRequest:
      type: object
      required:
        - name
        - description
        - price
        - currency_id
        - tax_cost
        - manufacturing_cost
      properties:
        name:
          type: string
          maxLength: 255
          example: Producto de ejemplo
        description:
          type: string
          example: Descripción detallada del producto
        price:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999999.99
          example: 100.00
        currency_id:
          type: integer
          example: 1
        tax_cost:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999999.99
          example: 16.00
        manufacturing_cost:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999999.99
          example: 50.00

    ProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          example: Producto actualizado
        description:
          type: string
          example: Descripción actualizada del producto
        price:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999999.99
          example: 150.00
        currency_id:
          type: integer
          example: 1
        tax_cost:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999999.99
          example: 20.00
        manufacturing_cost:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999999.99
          example: 60.00

    ProductResponse:
      type: object
      properties:
        error:
          type: array
          items: {}
        body:
          type: object
          properties:
            product:
              $ref: '#/components/schemas/Product'

    ProductListResponse:
      type: object
      properties:
        error:
          type: array
          items: {}
        body:
          type: object
          properties:
            products:
              type: object
              properties:
                current_page:
                  type: integer
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Product'
                first_page_url:
                  type: string
                from:
                  type: integer
                last_page:
                  type: integer
                last_page_url:
                  type: string
                links:
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                        nullable: true
                      label:
                        type: string
                      page:
                        type: integer
                        nullable: true
                      active:
                        type: boolean
                next_page_url:
                  type: string
                  nullable: true
                path:
                  type: string
                per_page:
                  type: integer
                prev_page_url:
                  type: string
                  nullable: true
                to:
                  type: integer
                total:
                  type: integer

    Price:
      type: object
      properties:
        id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        currency_id:
          type: integer
          example: 1
        price:
          type: string
          example: "120.00"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        divisa:
          $ref: '#/components/schemas/Divisa'

    PriceRequest:
      type: object
      required:
        - price
        - currency_id
      properties:
        price:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999999.99
          example: 120.00
        currency_id:
          type: integer
          example: 1

    PriceResponse:
      type: object
      properties:
        error:
          type: array
          items: {}
        body:
          type: object
          properties:
            price:
              $ref: '#/components/schemas/Price'

    PriceListResponse:
      type: object
      properties:
        error:
          type: array
          items: {}
        body:
          type: object
          properties:
            prices:
              type: object
              properties:
                current_page:
                  type: integer
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Price'
                first_page_url:
                  type: string
                from:
                  type: integer
                last_page:
                  type: integer
                last_page_url:
                  type: string
                links:
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                        nullable: true
                      label:
                        type: string
                      page:
                        type: integer
                        nullable: true
                      active:
                        type: boolean
                next_page_url:
                  type: string
                  nullable: true
                path:
                  type: string
                per_page:
                  type: integer
                prev_page_url:
                  type: string
                  nullable: true
                to:
                  type: integer
                total:
                  type: integer

    Divisa:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Euro
        symbol:
          type: string
          example: "€"
        exchange_rate:
          type: string
          example: "0.92000000"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DivisaRequest:
      type: object
      required:
        - name
        - symbol
        - exchange_rate
      properties:
        name:
          type: string
          maxLength: 255
          example: Euro
        symbol:
          type: string
          maxLength: 255
          example: "€"
        exchange_rate:
          type: number
          format: decimal
          minimum: 0
          maximum: 99999999.99999999
          example: 0.92000000

    DivisaResponse:
      type: object
      properties:
        error:
          type: array
          items: {}
        body:
          type: object
          properties:
            divisa:
              $ref: '#/components/schemas/Divisa'

    DivisaListResponse:
      type: object
      properties:
        error:
          type: array
          items: {}
        body:
          type: object
          properties:
            divisas:
              type: object
              properties:
                current_page:
                  type: integer
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Divisa'
                first_page_url:
                  type: string
                from:
                  type: integer
                last_page:
                  type: integer
                last_page_url:
                  type: string
                links:
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                        nullable: true
                      label:
                        type: string
                      page:
                        type: integer
                        nullable: true
                      active:
                        type: boolean
                next_page_url:
                  type: string
                  nullable: true
                path:
                  type: string
                per_page:
                  type: integer
                prev_page_url:
                  type: string
                  nullable: true
                to:
                  type: integer
                total:
                  type: integer

paths:
  /login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: Autentica un usuario y devuelve un token de acceso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Datos de validación inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products:
    get:
      tags:
        - Productos
      summary: Listar productos
      description: Obtiene una lista paginada de productos
      security:
        - bearerAuth: []
      parameters:
        - name: per_page
          in: query
          description: Número de productos por página
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: page
          in: query
          description: Número de página
          schema:
            type: integer
            default: 1
        - name: sort_by
          in: query
          description: Campo para ordenar
          schema:
            type: string
            enum: [id, name, description, price, currency_id, tax_cost, manufacturing_cost, created_at, updated_at]
            default: id
        - name: sort_direction
          in: query
          description: Dirección del ordenamiento
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          description: Parámetros de validación inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Productos
      summary: Crear producto
      description: Crea un nuevo producto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Datos de validación inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{productoId}:
    get:
      tags:
        - Productos
      summary: Obtener producto
      description: Obtiene un producto específico por ID
      security:
        - bearerAuth: []
      parameters:
        - name: productoId
          in: path
          required: true
          description: ID del producto
          schema:
            type: integer
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Productos
      summary: Actualizar producto
      description: Actualiza un producto existente
      security:
        - bearerAuth: []
      parameters:
        - name: productoId
          in: path
          required: true
          description: ID del producto
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Datos de validación inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Productos
      summary: Eliminar producto
      description: Elimina un producto (soft delete)
      security:
        - bearerAuth: []
      parameters:
        - name: productoId
          in: path
          required: true
          description: ID del producto
          schema:
            type: integer
      responses:
        '200':
          description: Producto eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: array
                    items: {}
                  body:
                    type: object
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{productoId}/prices:
    get:
      tags:
        - Precios
      summary: Listar precios de un producto
      description: Obtiene una lista paginada de precios para un producto específico
      security:
        - bearerAuth: []
      parameters:
        - name: productoId
          in: path
          required: true
          description: ID del producto
          schema:
            type: integer
        - name: per_page
          in: query
          description: Número de precios por página
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: page
          in: query
          description: Número de página
          schema:
            type: integer
            default: 1
        - name: sort_by
          in: query
          description: Campo para ordenar
          schema:
            type: string
            enum: [id, product_id, currency_id, price, created_at, updated_at]
            default: created_at
        - name: sort_direction
          in: query
          description: Dirección del ordenamiento
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Lista de precios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListResponse'
        '400':
          description: Parámetros de validación inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Precios
      summary: Crear precio
      description: Crea un nuevo precio para un producto
      security:
        - bearerAuth: []
      parameters:
        - name: productoId
          in: path
          required: true
          description: ID del producto
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceRequest'
      responses:
        '201':
          description: Precio creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'
        '400':
          description: Datos de validación inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /divisas:
    get:
      tags:
        - Divisas
      summary: Listar divisas
      description: Obtiene una lista paginada de divisas
      security:
        - bearerAuth: []
      parameters:
        - name: per_page
          in: query
          description: Número de divisas por página
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: page
          in: query
          description: Número de página
          schema:
            type: integer
            default: 1
        - name: sort_by
          in: query
          description: Campo para ordenar
          schema:
            type: string
            enum: [id, name, symbol, exchange_rate, created_at, updated_at]
            default: id
        - name: sort_direction
          in: query
          description: Dirección del ordenamiento
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Lista de divisas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DivisaListResponse'
        '400':
          description: Parámetros de validación inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Divisas
      summary: Crear divisa
      description: Crea una nueva divisa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DivisaRequest'
      responses:
        '201':
          description: Divisa creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DivisaResponse'
        '400':
          description: Datos de validación inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

tags:
  - name: Autenticación
    description: Endpoints de autenticación
  - name: Productos
    description: Gestión de productos
  - name: Precios
    description: Gestión de precios de productos
  - name: Divisas
    description: Gestión de divisas (monedas)
